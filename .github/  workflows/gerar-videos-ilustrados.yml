name: Gerar videos JuhQuiz Folha Rosa Ilustrada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg, fontes e emojis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation2 \
            fonts-noto-color-emoji \
            fontconfig
          fc-cache -f

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Gerar videos Folha Rosa Ilustrada
        run: python -u gerar_videos_ilustrados.py

      - name: Guardar os MP4 no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-FOLHA-ROSA-${{ github.run_number }}
          path: output_ilustrado/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
